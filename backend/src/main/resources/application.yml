server:
  port: 8080
spring:
  application:
    name: tamizaje-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tamizaje}
    username: ${DB_USER:tamizaje}
    password: ${DB_PASSWORD:tamizaje}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  ml:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_TIMEOUT_MS:2000}
management:
  endpoints.web.exposure.include: health
